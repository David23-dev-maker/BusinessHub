{% load static %}

<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Business Information | BusinessHub</title>

    <link rel="stylesheet" href="{% static 'css/style.css' %}">
</head>

<body>

    <div class="page">

        <div class="header">
            <div>
                <h1>Business Information</h1>
                <p>Tell us about your business</p>
            </div>

            <div class="brand">
                Business<span>Hub</span>
            </div>
        </div>

        <div class="card">

            <h2>Your Business</h2>

            <form method="POST" enctype="multipart/form-data">

                {% csrf_token %}

                <div class="logo-section">

                    <div class="logo-placeholder">
                        📷
                    </div>

                    <div>
                        <h3>Your Business Logo</h3>
                        <p>Upload a logo that represents your business.</p>

                        <input type="file" name="logo" accept="image/*">
                    </div>

                </div>

                <div class="form-grid">

                    <div class="form-group">
                        <label>Business Name</label>
                        <input
                            type="text"
                            name="name"
                            placeholder="Enter your business name"
                            required
                        >
                    </div>

                    <div class="form-group">
                        <label>Business Category</label>

                        <select name="category" required>
                            <option value="">Select a category</option>
                            <option value="food">Restaurants & Food</option>
                            <option value="shopping">Shopping & Retail</option>
                            <option value="electronics">Electronics & Computers</option>
                            <option value="home">Home & Living</option>
                            <option value="beauty">Health & Beauty</option>
                            <option value="transport">Transport & Logistics</option>
                            <option value="education">Education & Training</option>
                            <option value="services">Business Services</option>
                            <option value="sports">Sports & Recreation</option>
                            <option value="pets">Pets & Animals</option>
                            <option value="travel">Travel & Tourism</option>
                            <option value="other">Other Services</option>
                        </select>
                    </div>

                    <div class="form-group full">
                        <label>Business Description</label>

                        <textarea
                            name="description"
                            rows="5"
                            placeholder="Tell customers about your business"
                            required
                        ></textarea>
                    </div>

                    <div class="form-group">
                        <label>Phone Number</label>

                        <input
                            type="tel"
                            name="phone"
                            placeholder="Enter phone number"
                            required
                        >
                    </div>

                    <div class="form-group">
                        <label>Email Address</label>

                        <input
                            type="email"
                            name="email"
                            placeholder="Enter email address"
                            required
                        >
                    </div>

                    <div class="form-group full">
                        <label>Business Address</label><input
                            type="text"
                            name="city"
                            placeholder="Enter your business address"
                            required
                        >
                    </div>

                    <div class="form-group">
                        <label>Region</label>

                        <input
                            type="text"
                            name="region"
                            placeholder="Enter your region"
                            required
                        >
                    </div>

                    <div class="form-group">
                        <label>Opening Time</label>

                        <input
                            type="time"
                            name="opening_time"
                        >
                    </div>

                    <div class="form-group">
                        <label>Closing Time</label>

                        <input
                            type="time"
                            name="closing_time"
                        >
                    </div>

                </div>

                <div class="actions">

                    <button type="button" class="back-btn">
                        Back
                    </button>

                    <button type="submit" class="continue-btn">
                        Continue
                    </button>

                </div>

            </form>

        </div>

    </div>

</body>
</html>
