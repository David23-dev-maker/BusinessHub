<!DOCTYPE html>
<html>
<head>
    <title>Edit Business - BusinessHub</title>
    {% load static %}
    <link rel="stylesheet" href="{% static 'css/style.css' %}">
</head>

<body>

<div class="edit-business-container">

    <h1>Edit Your Business</h1>

    <form method="POST">
        {% csrf_token %}

        <label>Business Name</label>
        <input
            type="text"
            name="business_name"
            value="{{ business.business_name }}"
            required
        >

        <label>Category</label>
        <input
            type="text"
            name="category"
            value="{{ business.category }}"
            required
        >

        <label>Description</label>
        <textarea
            name="description"
            required
        >{{ business.description }}</textarea>

        <label>City</label>
        <input
            type="text"
            name="city"
            value="{{ business.city }}"
            required
        >

        <label>Region</label>
        <input
            type="text"
            name="region"
            value="{{ business.region }}"
            required
        >

        <label>Phone</label>
        <input
            type="text"
            name="phone"
            value="{{ business.phone }}"
            required
        >

        <button type="submit">
            Save Changes
        </button>

    </form>

    <br>

    <a href="{% url 'owner_dashboard' %}">
        ← Back to Dashboard
    </a>

</div>

</body>
</html>
